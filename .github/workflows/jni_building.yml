
name: Building helloWorld JNI DLL

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile DLL
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /I"%JAVA_HOME%\include" /I"%JAVA_HOME%\include\win32" native.cpp /link /OUT:helloWorldJNI.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: helloWorldJNI-DLL
          path: helloWorldJNI.dll
